<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src='https://api.mapbox.com/mapbox.js/v3.3.1/mapbox.js'></script>
    <link href='https://api.mapbox.com/mapbox.js/v3.3.1/mapbox.css' rel='stylesheet' />

    <title>WebSocket Client</title>

</head>

<body>

    <div id='map' style='width: 2200px; height: 1200px;'></div>

</body>

<script>

//

    const socket = new WebSocket('ws://localhost:8080');

socket.addEventListener('open', function (event) {

    socket.send('Connection Established');

});



socket.addEventListener('message', function (event) {

    //console.log(event.data);
    // lat,lng lat,lng load_j['score']+" "+load_j['risk']+" "+hostname+" "+asn+" "+isp+" "+domain_name
    // 44.2719,5.2715 40.7357,-74.1724 192.168.1.25 3.225.94.827 medium ec2-3-225-94-8.compute-1.amazonaws.com 14618 -
    ev_data_split = event.data.split(' ');
    src = [parseFloat(ev_data_split[0].split(',')[0]), parseFloat(ev_data_split[0].split(',')[1])];
    dst = [parseFloat(ev_data_split[1].split(',')[0]), parseFloat(ev_data_split[1].split(',')[1])];

    ip_src = ev_data_split[2];
    ip_dst = ev_data_split[3];

    score = ev_data_split[4];
    risk = ev_data_split[3];
    hostname = ev_data_split[5];
    asn = ev_data_split[6];
    isp = ev_data_split[7];
    domain_name = ev_data_split[7];

    console.log(">> "+src+" "+dst+" "+score+" "+risk+" "+hostname+" "+asn+" "+isp+" "+domain_name);
    setLine(src, dst, ip_src, ip_dst, score, hostname, asn, isp, domain_name);

});

L.mapbox.accessToken = 'pk.eyJ1Ijoic3NhcmNlbCIsImEiOiJja3FmZjViOGkwcXN2MnFwZzYzazY4M2pvIn0.sYMwxyxdEkIcmolMo_X1ow';
var map = L.mapbox.map('map')
    .setView([38.89399, -77.03659], 17)
    .addLayer(L.mapbox.styleLayer('mapbox://styles/mapbox/streets-v11'));

var maline = ""
var src_marker = ""
var dst_marker = ""

const geojson = [
  {
    type: 'Feature',
    geometry: {
      type: 'Point',
      coordinates: [0, 0]
    },
    properties: {
      'marker-color': '#3bb2d0',
      'marker-size': 'large',
      'marker-symbol': 'diamond'
    }
  },
  {
    type: 'Feature',
    geometry: {
      type: 'Point',
      coordinates: [15, 0]
    },
    properties: {
      'marker-color': '#3bb2d0',
      'marker-size': 'large',
      'marker-symbol': 'home'
    }
  }
];

const myLayer = L.mapbox.featureLayer().setGeoJSON(geojson).addTo(map);

function setLine(src_c, dst_c, ip_src, ip_dst, score, hostname, asn, isp, domain_name)
{

  if(maline != "")
  {
    map.removeLayer(maline);
    map.removeLayer(src_marker);
    map.removeLayer(dst_marker);
  }


  maline = L.polyline([src_c, dst_c], {
      color: 'lightgreen',
      smoothFactor: 10.0
  }).addTo(map)


  L.polyline([src_c, dst_c], {
      color: 'red',
      smoothFactor: 10.0,
      opacity: 0.3
  }).addTo(map)

  src_marker = L.marker(src_c).bindPopup('TEST !').addTo(map);
  dst_marker = L.marker(dst_c).addTo(map);

  if(ip_src.split('.')[0] != '192')
  {
      L.marker(src_c).bindPopup(ip_src+" "+asn+" "+isp+" "+domain_name).addTo(map);
  }
  else
  {
      L.marker(dst_c).bindPopup(ip_dst+" "+asn+" "+isp+" "+domain_name).addTo(map);
  }


}

</script>

</html>
