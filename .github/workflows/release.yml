name: Release

# Builds standalone NetMapGuard executables for Linux, macOS and Windows
# with PyInstaller, and publishes them to a GitHub Release whenever a
# "v*" tag is pushed (e.g. v2.0.0).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: netmapguard-linux-x86_64
            artifact_path: dist/netmapguard
          - os: macos-latest
            asset_name: netmapguard-macos-arm64
            artifact_path: dist/netmapguard
          - os: windows-latest
            asset_name: netmapguard-windows-x86_64.exe
            artifact_path: dist/netmapguard.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller netmapguard.spec --noconfirm

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.artifact_path }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
